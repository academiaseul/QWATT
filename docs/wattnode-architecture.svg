<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6edf7"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05252"/>
    </marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c47a1a"/>
    </marker>
    <marker id="ar-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#108ec0"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb37a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1120" height="760" fill="#0b1220"/>
  <rect x="0" y="0" width="1120" height="760" fill="none" stroke="#1d2a40" stroke-width="2"/>

  <!-- title -->
  <text x="40" y="38" fill="#e6edf7" font-size="20" font-weight="700">WattNode v1 — retrofit architecture on an existing hybrid solar system</text>
  <text x="40" y="58" fill="#8fa3c0" font-size="12">Physical layer (top) · proof-of-generation node (middle) · Stellar layer (bottom) · QWATT protocol</text>

  <!-- layer bands -->
  <rect x="24" y="70" width="1072" height="250" fill="#0f1727" stroke="#1d2a40" rx="6"/>
  <text x="34" y="88" fill="#5c7394" font-size="11" font-weight="600">EXISTING SYSTEM + ADDED METERS</text>
  <rect x="24" y="336" width="1072" height="200" fill="#0f1727" stroke="#1d2a40" rx="6"/>
  <text x="34" y="354" fill="#5c7394" font-size="11" font-weight="600">WATTNODE (added)</text>
  <rect x="24" y="552" width="1072" height="130" fill="#0f1727" stroke="#1d2a40" rx="6"/>
  <text x="34" y="570" fill="#5c7394" font-size="11" font-weight="600">STELLAR LAYER</text>

  <!-- ===== Row 1: power path ===== -->
  <!-- PV array -->
  <rect x="40" y="100" width="150" height="70" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="115" y="128" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">PV array</text>
  <text x="115" y="148" fill="#8fa3c0" font-size="11" text-anchor="middle">8 × 550 Wp, 2 strings</text>

  <!-- M1 DC meter -->
  <rect x="230" y="100" width="130" height="70" rx="6" fill="#1a1b22" stroke="#c47a1a" stroke-width="2"/>
  <text x="295" y="124" fill="#c47a1a" font-size="13" font-weight="700" text-anchor="middle">M1 · DC meter</text>
  <text x="295" y="142" fill="#e6edf7" font-size="11" text-anchor="middle">1 per MPPT · ≥600 V</text>
  <text x="295" y="158" fill="#8fa3c0" font-size="11" text-anchor="middle">Modbus RTU · ID 2, 3</text>

  <!-- Hybrid inverter -->
  <rect x="400" y="90" width="200" height="90" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="500" y="116" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Hybrid inverter</text>
  <text x="500" y="136" fill="#8fa3c0" font-size="11" text-anchor="middle">Deye / Growatt / Sungrow / Victron</text>
  <text x="500" y="154" fill="#c47a1a" font-size="11" text-anchor="middle">M2 · Modbus port · ID 1</text>
  <text x="500" y="170" fill="#8fa3c0" font-size="10" text-anchor="middle">(or logger Modbus-TCP over LAN)</text>

  <!-- Critical loads panel -->
  <rect x="640" y="100" width="140" height="70" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="710" y="128" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Critical-loads panel</text>
  <text x="710" y="148" fill="#8fa3c0" font-size="11" text-anchor="middle">backup output</text>

  <!-- Main panel -->
  <rect x="820" y="100" width="150" height="70" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="895" y="128" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Main panel</text>
  <text x="895" y="148" fill="#8fa3c0" font-size="11" text-anchor="middle">house loads · 3 CTs</text>

  <!-- Grid -->
  <rect x="1010" y="100" width="70" height="70" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="1045" y="140" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Grid</text>

  <!-- power arrows -->
  <line x1="190" y1="135" x2="228" y2="135" stroke="#e05252" stroke-width="3" marker-end="url(#ar-r)"/>
  <line x1="360" y1="135" x2="398" y2="135" stroke="#e05252" stroke-width="3" marker-end="url(#ar-r)"/>
  <text x="294" y="92" fill="#e05252" font-size="10" text-anchor="middle">DC 300–450 V</text>
  <line x1="600" y1="135" x2="638" y2="135" stroke="#e6edf7" stroke-width="3" marker-end="url(#ar-w)"/>
  <line x1="780" y1="135" x2="818" y2="135" stroke="#e6edf7" stroke-width="3" marker-end="url(#ar-w)"/>
  <line x1="970" y1="135" x2="1008" y2="135" stroke="#e6edf7" stroke-width="3" marker-start="url(#ar-w)" marker-end="url(#ar-w)"/>
  <text x="800" y="92" fill="#e6edf7" font-size="10" text-anchor="middle">AC 230 V</text>
  <text x="989" y="160" fill="#8fa3c0" font-size="9" text-anchor="middle">import / export</text>

  <!-- ===== Row 2: battery, shelly, witness ===== -->
  <!-- Battery -->
  <rect x="440" y="240" width="120" height="60" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="500" y="264" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Battery</text>
  <text x="500" y="282" fill="#8fa3c0" font-size="11" text-anchor="middle">2 × 4.8 kWh LiFePO4</text>
  <line x1="500" y1="180" x2="500" y2="238" stroke="#8fa3c0" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="510" y="212" fill="#8fa3c0" font-size="10">CAN (BMS)</text>
  <text x="510" y="224" fill="#8fa3c0" font-size="10">not touched</text>

  <!-- Shelly -->
  <rect x="820" y="240" width="150" height="60" rx="6" fill="#1a1b22" stroke="#c47a1a" stroke-width="2"/>
  <text x="895" y="262" fill="#c47a1a" font-size="13" font-weight="700" text-anchor="middle">M3 · Shelly Pro 3EM</text>
  <text x="895" y="280" fill="#8fa3c0" font-size="11" text-anchor="middle">grid import / export</text>
  <line x1="895" y1="170" x2="895" y2="238" stroke="#c47a1a" stroke-width="2"/>
  <text x="905" y="212" fill="#8fa3c0" font-size="10">CT clamps</text>

  <!-- Sun witness -->
  <rect x="40" y="240" width="150" height="60" rx="6" fill="#1a1b22" stroke="#c47a1a" stroke-width="2"/>
  <text x="115" y="262" fill="#c47a1a" font-size="13" font-weight="700" text-anchor="middle">M4 · Sun witness</text>
  <text x="115" y="280" fill="#8fa3c0" font-size="11" text-anchor="middle">5 W ref. cell + INA226</text>

  <!-- ===== Row 3: WattNode ===== -->
  <rect x="230" y="372" width="560" height="140" rx="8" fill="#131c2e" stroke="#108ec0" stroke-width="2"/>
  <text x="250" y="398" fill="#108ec0" font-size="15" font-weight="700">WattNode</text>
  <text x="340" y="398" fill="#8fa3c0" font-size="11">Raspberry Pi 4 · oracle.js · read-only root · hardware watchdog</text>
  <!-- inner chips -->
  <g font-size="11" fill="#e6edf7">
    <rect x="250" y="412" width="118" height="26" rx="4" fill="#0f1727" stroke="#2a3a55"/><text x="309" y="429" text-anchor="middle">RS485 master (iso)</text>
    <rect x="378" y="412" width="100" height="26" rx="4" fill="#0f1727" stroke="#2a3a55"/><text x="428" y="429" text-anchor="middle">Ethernet + 4G</text>
    <rect x="488" y="412" width="80" height="26" rx="4" fill="#0f1727" stroke="#2a3a55"/><text x="528" y="429" text-anchor="middle">RTC DS3231</text>
    <rect x="578" y="412" width="90" height="26" rx="4" fill="#0f1727" stroke="#2a3a55"/><text x="623" y="429" text-anchor="middle">SE050 key</text>
    <rect x="678" y="412" width="96" height="26" rx="4" fill="#0f1727" stroke="#2a3a55"/><text x="726" y="429" text-anchor="middle">tamper · temp</text>
  </g>
  <g font-size="11" fill="#8fa3c0">
    <text x="250" y="462">sampler 10 s  →  batcher 5 min  →  validator (cap · night · divergence · witness · ramp · clock · tamper)</text>
    <text x="250" y="480">→ verified.db  →  minter (≥1 kWh or hourly)  →  sign with PANEL key  →  outbox  →  uplink</text>
    <text x="250" y="498" fill="#5c7394">M5 · integrity flags · LEDs: power / bus OK / last mint</text>
  </g>

  <!-- RS485 bus lines (amber) -->
  <line x1="295" y1="170" x2="295" y2="370" stroke="#c47a1a" stroke-width="2.5" marker-end="url(#ar-a)"/>
  <line x1="415" y1="180" x2="415" y2="370" stroke="#c47a1a" stroke-width="2.5" marker-end="url(#ar-a)"/>
  <text x="302" y="330" fill="#c47a1a" font-size="10">RS485 · Modbus RTU · 9600 8N1</text>
  <text x="302" y="342" fill="#8fa3c0" font-size="10">daisy chain · 120 Ω both ends</text>

  <!-- LAN line from Shelly (cyan) -->
  <polyline points="895,300 895,440 792,440" fill="none" stroke="#108ec0" stroke-width="2.5" marker-end="url(#ar-c)"/>
  <text x="905" y="340" fill="#108ec0" font-size="10">LAN · HTTP RPC · 10 s</text>

  <!-- I2C line from witness (cyan) -->
  <polyline points="115,300 115,440 228,440" fill="none" stroke="#108ec0" stroke-width="2.5" marker-end="url(#ar-c)"/>
  <text x="60" y="340" fill="#108ec0" font-size="10">I2C · irradiance proxy</text>

  <!-- Power feed from critical loads (green dashed) -->
  <line x1="710" y1="170" x2="710" y2="370" stroke="#4fb37a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-g)"/>
  <text x="718" y="330" fill="#4fb37a" font-size="10">230 V backup → DIN PSU 5 V</text>
  <text x="718" y="342" fill="#8fa3c0" font-size="10">node survives grid outages</text>

  <!-- ===== Row 4: Stellar layer ===== -->
  <!-- Co-signer -->
  <rect x="230" y="586" width="280" height="80" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="370" y="608" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Treasury co-signer (cloud)</text>
  <text x="370" y="626" fill="#8fa3c0" font-size="11" text-anchor="middle">panel registry · plausibility re-check · caps</text>
  <text x="370" y="642" fill="#8fa3c0" font-size="11" text-anchor="middle">distributor key in HSM / Vault · never on nodes</text>
  <text x="370" y="658" fill="#5c7394" font-size="10" text-anchor="middle">adds 2nd signature, submits</text>

  <!-- Horizon -->
  <rect x="580" y="586" width="210" height="80" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="685" y="608" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Stellar Horizon</text>
  <text x="685" y="626" fill="#8fa3c0" font-size="11" text-anchor="middle">1 atomic tx: hash anchor +</text>
  <text x="685" y="642" fill="#8fa3c0" font-size="11" text-anchor="middle">total update + QWATT payment</text>
  <text x="685" y="658" fill="#5c7394" font-size="10" text-anchor="middle">memo PoG#42:12.40kWh</text>

  <!-- Proof / Pulse -->
  <rect x="860" y="586" width="210" height="80" rx="6" fill="#131c2e" stroke="#2a3a55"/>
  <text x="965" y="608" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="middle">Explorer · Proof · Pulse</text>
  <text x="965" y="626" fill="#8fa3c0" font-size="11" text-anchor="middle">anyone re-verifies batches</text>
  <text x="965" y="642" fill="#8fa3c0" font-size="11" text-anchor="middle">and reserves, live</text>

  <!-- uplink arrows -->
  <line x1="370" y1="512" x2="370" y2="584" stroke="#108ec0" stroke-width="2.5" marker-end="url(#ar-c)"/>
  <text x="380" y="540" fill="#108ec0" font-size="10">HTTPS, outbound only</text>
  <text x="380" y="552" fill="#8fa3c0" font-size="10">panel-signed XDR + batch JSON</text>
  <line x1="510" y1="626" x2="578" y2="626" stroke="#e6edf7" stroke-width="2.5" marker-end="url(#ar-w)"/>
  <text x="544" y="616" fill="#8fa3c0" font-size="10" text-anchor="middle">submit</text>
  <line x1="685" y1="512" x2="685" y2="584" stroke="#8fa3c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-w)"/>
  <text x="695" y="540" fill="#8fa3c0" font-size="10">verify tx hash</text>
  <text x="695" y="552" fill="#8fa3c0" font-size="10">(read-only)</text>
  <line x1="790" y1="626" x2="858" y2="626" stroke="#e6edf7" stroke-width="2.5" marker-end="url(#ar-w)"/>

  <!-- legend -->
  <g font-size="10" fill="#8fa3c0">
    <line x1="40" y1="712" x2="70" y2="712" stroke="#e05252" stroke-width="3"/><text x="76" y="716">DC high voltage</text>
    <line x1="170" y1="712" x2="200" y2="712" stroke="#e6edf7" stroke-width="3"/><text x="206" y="716">AC 230 V</text>
    <line x1="270" y1="712" x2="300" y2="712" stroke="#c47a1a" stroke-width="2.5"/><text x="306" y="716">RS485 / Modbus RTU</text>
    <line x1="430" y1="712" x2="460" y2="712" stroke="#108ec0" stroke-width="2.5"/><text x="466" y="716">LAN · I2C · HTTPS</text>
    <line x1="580" y1="712" x2="610" y2="712" stroke="#4fb37a" stroke-width="2" stroke-dasharray="6 4"/><text x="616" y="716">node power</text>
    <line x1="700" y1="712" x2="730" y2="712" stroke="#8fa3c0" stroke-width="2" stroke-dasharray="5 4"/><text x="736" y="716">existing link / read-only</text>
    <rect x="880" y="705" width="14" height="14" rx="2" fill="#1a1b22" stroke="#c47a1a" stroke-width="2"/><text x="900" y="716">added by QWATT</text>
  </g>
  <text x="40" y="742" fill="#5c7394" font-size="10">Two-party minting: the node signs evidence with the panel key; the treasury co-signs the QWATT payment only after its own physics check. A compromised node is a broken sensor, not a money printer.</text>
</svg>
