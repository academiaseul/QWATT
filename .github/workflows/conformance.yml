name: conformance

# Every binding of protocol/gates.spec.json is held to protocol/conformance/cases.json.
# No install step: the engine, the validators and the runner have zero dependencies.
# Every suite step runs even when an earlier one failed (if: !cancelled()), so a red
# commit records every red suite, not only the first.

on:
  push:
    branches: [main, 'semana-2/**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the site test proves that every commit and release
          # cited as evidence in assets/status.json exists (DESIGN FD-16).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
      - name: Generated bindings are current
        if: ${{ !cancelled() }}
        run: node protocol/gen.js --check
      - name: Conformance suite (shared engine, schema, bindings)
        if: ${{ !cancelled() }}
        run: node protocol/conformance.test.js
      - name: Validator adversary tests (V1–V7)
        if: ${{ !cancelled() }}
        run: node mining-rig/validators.test.js
      - name: Ingestion tests + Deliverable 1 acceptance harness
        if: ${{ !cancelled() }}
        run: node ingest/ingest.test.js
      - name: Batch conformance (Deliverable 2) — hash chain, tamper suite, restart safety
        if: ${{ !cancelled() }}
        run: node batch/batch.test.js
      - name: Scale test (Deliverable 2) — NREL PVDAQ NIST Ground, Sept 2017 (CC BY 4.0), chain verified, deterministic, reproduces the committed evidence
        if: ${{ !cancelled() }}
        run: node batch/scale.js --dataset datasets/pvdaq-4902-2017-09/dataset.json --expect evidence/scale/scale-pvdaq-4902-2017-09.json
      - name: Anchoring dependencies (Deliverable 3) — the only suites with a dependency
        if: ${{ !cancelled() }}
        run: npm ci --prefix anchor --no-audit --no-fund
      - name: Anchoring transaction builder (Deliverable 3)
        if: ${{ !cancelled() }}
        run: node anchor/tx.test.js
      - name: Anchoring recovery (SOW D4 recovery)
        if: ${{ !cancelled() }}
        run: node anchor/recovery.test.js
      - name: Anchoring real-account A–D tool and thresholds (Deliverable 3)
        if: ${{ !cancelled() }}
        run: node anchor/tests-abcd.test.js
      - name: Anchoring keys — signing through stellar-cli (V3-8)
        if: ${{ !cancelled() }}
        run: node anchor/keys.test.js
      - name: Reconciliation (Deliverable 4) — the logic reconcile.html runs in the browser
        if: ${{ !cancelled() }}
        run: node batch/reconcile.test.js
      - name: Live run (Deliverable 4) — accelerated multi-day run, every fault refused, coverage complete
        if: ${{ !cancelled() }}
        run: node live/live.test.js
      - name: Watchdog decisions (plan 3.9)
        if: ${{ !cancelled() }}
        run: node ops/watch.test.js
      - name: Evidence publisher (two repositories, a public history) and its history audit, against local bare remotes
        if: ${{ !cancelled() }}
        run: node ops/publish-feed.test.js
      - name: Write-up generator — account rules stated from Horizon, never from a constant (fetch stubbed)
        if: ${{ !cancelled() }}
        run: node ops/writeup.test.js
      - name: Key policy (V3-8) — no secret in env files, the repository or a browser
        if: ${{ !cancelled() }}
        run: node ops/keys-policy.test.js
      - name: Host package (W2-5) — Node at /usr/bin/node, stellar-cli 28.1.0, each role's units and deploy key, WSL kept running with nobody signed in
        if: ${{ !cancelled() }}
        run: node ops/host-package.test.js
      - name: "Site: stamped blocks and shared header/footer match status.json and ops/site-fragments"
        if: ${{ !cancelled() }}
        run: node ops/site-sync.js --check
      - name: "Site: hard rules on every deployed file, status, links, languages, accessibility, weight"
        if: ${{ !cancelled() }}
        run: node ops/site.test.js
      - name: "Site: live testnet helper with Horizon stubbed (no amounts, no secrets, right network)"
        if: ${{ !cancelled() }}
        run: node ops/site-live.test.js
      - name: "Protocol browser build is current (assets/qwatt-protocol.js = a fresh build of the sources)"
        if: ${{ !cancelled() }}
        run: node protocol/build-browser.js --check
      - name: "Sample feeds are current and re-derive (evidence/feeds: the anchored 8 Oct batches and the sample day)"
        if: ${{ !cancelled() }}
        run: node ops/sample-feeds.js --check
      - name: "Browser build equals Node on vectors, feeds and tampering (the verification page's checklist)"
        if: ${{ !cancelled() }}
        run: node ops/protocol-browser.test.js
      - name: "Evidence formats: sample feeds and tests A-D (R-FEEDS, R-ABCD)"
        if: ${{ !cancelled() }}
        run: node ops/site-evidence.test.js

  # The host package installed for real on a clean Ubuntu VM, once per role (plan W2-5): install.sh
  # from a checkout at /opt/qwatt, then check.sh. WAIT lines (no key yet, deploy key not added) are
  # expected here; any FAIL fails the job. Nothing here holds or creates a stellar-cli key.
  host-package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [proposer, verifier]
    steps:
      - uses: actions/checkout@v7
      - name: "Host package: install.sh --role ${{ matrix.role }} on a clean VM"
        run: |
          sudo git clone --quiet "$GITHUB_WORKSPACE" /opt/qwatt
          sudo git -C /opt/qwatt checkout --quiet --detach "$GITHUB_SHA"
          sudo bash /opt/qwatt/ops/deploy/host/install.sh --role ${{ matrix.role }} --commit "$GITHUB_SHA"
      - name: "Host package: check.sh --role ${{ matrix.role }} (no FAIL)"
        run: sudo bash /opt/qwatt/ops/deploy/host/check.sh --role ${{ matrix.role }} --commit "$GITHUB_SHA"
      - name: "Host package: running install.sh again changes nothing it should keep"
        run: |
          sum() { sudo sha256sum /etc/qwatt/*.env /home/qwatt/.ssh/qwatt-* | sort; }
          before=$(sum)
          sudo bash /opt/qwatt/ops/deploy/host/install.sh --role ${{ matrix.role }} --commit "$GITHUB_SHA" > /dev/null
          [ "$before" = "$(sum)" ] || { echo "a second run changed env files or the deploy key"; exit 1; }
