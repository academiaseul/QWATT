# stellar.toml — QWATT / Quorelia SpA · SEP-1 asset metadata
# Served at https://qwatt.org/.well-known/stellar.toml with Access-Control-Allow-Origin: *
# (vercel.json sets the header). Discovery only works once the ISSUER account has
# home_domain = qwatt.org — run set-home-domain.js. As of 2026-08-25 it is NOT set,
# so wallets and stellar.expert still show QWATT as an unknown asset.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ BEFORE PUBLISHING THIS VERSION                                           │
# │  1. Fill every [COMPLETAR] field. Placeholder text published to a SEP-1  │
# │     reviewer reads worse than the shorter v2.6.0 this replaces.          │
# │  2. Confirm the MODEL NOTE below matches the site. index.html says       │
# │     "1 QWATT = 1 MWh" in 14 places; this file must never contradict it.  │
# └──────────────────────────────────────────────────────────────────────────┘
#
# MODEL NOTE (2026-08-25)
#   Two incompatible definitions of QWATT are in play:
#     (a) LIVE / BLUEPRINT:  1 QWATT = 1 MWh under the protocol. 42,700,000 units
#         pre-minted at genesis 2026-08-22, held in treasury, tracking the EPEX
#         spot price. Demonstration asset — not anchored, nothing redeemable.
#     (b) PROPOSED (draft toml v2.7.0, 2026-08-25):  1 QWATT = 1 kWh delivered,
#         elastic supply, issued only on dual-meter verified generation, burned
#         on redemption against an energy invoice.
#   (b) is the stronger product and is what the WattNode proof-of-generation
#   hardware actually measures — but it is not what is on-chain today, and the
#   42.7M legacy units contradict it. Until those units are burned or quarantined
#   AND a supply contract exists, this file describes (a) truthfully and records
#   (b) as roadmap. Editing this text is not what makes (b) true.

VERSION = "2.7.0"

