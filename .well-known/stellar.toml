NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"

# Accounts this domain claims control of. Wallets and explorers use this to link
# domain and accounts in both directions.
ACCOUNTS = [
  "GDN6IWJT4ES7CI6BEGXWLAXFM6737XAAEQSV5PNSYNDHOGH7PI7BLT46",
  "GCLS6EE5UNXFNK44SQGD4F3TYYFE7QCJX2QEXQ5E4TOQSAQBZUXTSOKW"
]

[DOCUMENTATION]
ORG_NAME = "Quorelia SpA"
ORG_DBA = "QWATT"
ORG_URL = "https://qwatt.org"
ORG_LOGO = "https://qwatt.org/logo.png"
ORG_DESCRIPTION = "QWATT is an energy-verification protocol for distributed solar: metered production is checked against physics by an independent second instrument, and the verified event is recorded publicly on Stellar. Testnet demonstration — see https://qwatt.org/whitepaper.html for the model and its current limits."
ORG_OFFICIAL_EMAIL = "jay@quorelia.org"
ORG_SUPPORT_EMAIL = "jay@quorelia.org"
ORG_GITHUB = "https://github.com/academiaseul/QWATT"
# ORG_PHYSICAL_ADDRESS — deliberately absent until the SpA's registered domicile
#   is confirmed. SEP-1 treats it as optional; a placeholder address published
#   here would be a false statement about a legal entity. Add it as one line:
#   ORG_PHYSICAL_ADDRESS = "<calle numero, comuna>, Santiago, Chile"
# ORG_TWITTER — omit the key entirely rather than publish an empty value.

# One block per founder. SEP-1 reviewers and wallet directories weight this section.
# NOTE: `name` is a public identity claim — verify the spelling matches the ID
# document before this file is treated as authoritative at mainnet.
[[PRINCIPALS]]
name = "Jay Kim"
email = "jay@quorelia.org"
github = "https://github.com/academiaseul"

[[PRINCIPALS]]
name = "Diego Ostertag"
# email = "<correo confirmado>"   # add once Diego confirms the address he wants published

[[CURRENCIES]]
code = "QWATT"
issuer = "GDN6IWJT4ES7CI6BEGXWLAXFM6737XAAEQSV5PNSYNDHOGH7PI7BLT46"
name = "QWATT"
display_decimals = 2
image = "https://qwatt.org/logo.png"

# TODO-MAINNET: change to "live" at mainnet genesis.
status = "test"

desc = "Testnet demonstration asset for the QWATT energy-verification protocol, where 1 QWATT = 1 MWh under the protocol. The current on-chain supply (42,700,000 units, minted in a single genesis transaction on 2026-08-22) is a demonstration supply: it was not produced by verified generation and is not redeemable for energy, money, or anything else."

conditions = "Demonstration only, Stellar testnet. No outstanding unit represents delivered energy, a claim on energy, a security, an investment, or a debt of the issuer. The protocol's verification design — dual independent metering, nameplate-capacity ceiling, solar-elevation gate, meter-divergence check, and the evidence hash anchored in the recording transaction — is implemented for demonstration and has not yet issued a unit against a physically verified event. Any move to verified issuance, redemption, or mainnet requires burning or quarantining the legacy supply, a written supply contract, and Chilean legal review; none has occurred as of 2026-08-25."

# Anchoring is a factual claim about redeemability, not a marketing field. It stays
# false until (1) the legacy supply is retired, (2) a supply contract exists that a
# holder could actually enforce, and (3) counsel has signed off. Flipping this to
# true — and adding anchor_asset_type / anchor_asset / redemption_instructions —
# is a legal decision, not a text edit.
is_asset_anchored = false

